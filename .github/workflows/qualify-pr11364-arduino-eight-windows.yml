name: PR11364 Arduino eight Windows proof

# Temporary head-source evidence lane. Ordinary Quality Gate and the existing
# ci:windows advisory still run independently; this is not the entire PR workload.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths:
      - crates/zeroclaw-hardware/src/peripherals/arduino_upload.rs
      - .github/workflows/qualify-pr11364-arduino-eight-windows.yml

permissions:
  contents: read

jobs:
  arduino-eight-windows:
    name: PR11364 exact Arduino eight / Windows
    if: >-
      github.event.pull_request.number == 11364 &&
      github.event.pull_request.head.repo.full_name == 'zeroclaw-labs/zeroclaw' &&
      github.event.pull_request.head.ref == 'test/hardware-windows-fake-arduino-cli' &&
      github.event.pull_request.base.ref == 'master'
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: false
    env:
      PROOF_HEAD: ${{ github.event.pull_request.head.sha }}
      PROOF_BASE: ${{ github.event.pull_request.base.sha }}
      PROOF_MERGE: ${{ github.sha }}
      PROOF_WORKFLOW: ${{ github.workflow_sha }}
      PROOF_REPO: ${{ github.repository }}
      PROOF_TOPIC: ${{ github.event.pull_request.head.ref }}
      PROOF_NUMBER: ${{ github.event.pull_request.number }}
      PROOF_EXPECTED: >-
        ["peripherals::arduino_upload::tests::fake_cli_success_runs_all_stages_and_cleans_workspace",
        "peripherals::arduino_upload::tests::compile_failure_reports_stderr_and_cleans_workspace",
        "peripherals::arduino_upload::tests::failed_preflight_does_not_compile_or_upload",
        "peripherals::arduino_upload::tests::non_not_found_spawn_error_keeps_its_cause",
        "peripherals::arduino_upload::tests::compile_timeout_kills_reaps_and_cleans_workspace",
        "peripherals::arduino_upload::tests::preflight_timeout_reports_its_stage",
        "peripherals::arduino_upload::tests::upload_timeout_reports_its_stage_and_cleans_workspace",
        "peripherals::arduino_upload::tests::upload_failure_reports_stderr_and_cleans_workspace"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind head source and install the inline evidence harness
        id: prepare
        timeout-minutes: 2
        shell: python {0}
        run: |
          # Only this workflow is tracked. The identical script is retained in
          # runner temp for later phases; it never enters the source checkout.
          import ctypes as c
          from ctypes import wintypes as w
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import re
          import shutil
          import subprocess
          import sys
          import tarfile
          import time
          import urllib.request

          ANCESTOR = "6b98ff79ba9c7a0b3246e1c2398626f8a652c25e"
          WORKFLOW = ".github/workflows/qualify-pr11364-arduino-eight-windows.yml"
          ARDUINO = "crates/zeroclaw-hardware/src/peripherals/arduino_upload.rs"
          MODULE = "peripherals::arduino_upload::tests::"
          EXPECTED = json.loads(os.environ["PROOF_EXPECTED"])
          BODY_HASHES = [
              "62b62dfa8bc12e71ec3b3b619a4345e4eeea4a42f15cf5d7845efffde66cc617",
              "db0ac02938f9a8c42bf8c43ffad607a7d39ee5e12a1598dc89e97b0625e8d919",
              "00e027eb758c1a368438d7bfdf3caccc49e2f8d7563e9e0e4897c9e0fcbf8d01",
              "bc5b7e764405431f8716836e30b8656ce61675b87ec9ae46db4b9d58de7d9bae",
              "19bdda3fd1d53f31dc640225cbc93c9ff5a20526f48bf217b0266488dfb2d6d3",
              "95d3424e1e34de1698ae1e4e6c4012c9f0bfed861323793d521356e6cadd8440",
              "9a606dc331ea2dcc999d80b83cab543f6b89136b58521dd6f46558c628d5bdb5",
              "304b88c801345474c8d39e4f01cf8ea9b4d511078db855d1b8c9747250185b3e",
          ]
          COMMON = ["--locked", "-p", "zeroclaw-hardware", "--features", "hardware",
                    "--lib", "-E", "test(/^peripherals::arduino_upload::tests::/)"]
          LIST = ["cargo", "nextest", "list", *COMMON, "--message-format", "json"]
          RUN = ["cargo", "nextest", "run", *COMMON, "--no-fail-fast", "--no-tests",
                 "fail", "--retries", "0", "--status-level", "pass",
                 "--final-status-level", "fail", "--color", "never"]
          SHA = re.compile(r"[0-9a-f]{40}")
          HEX = re.compile(r"[0-9a-f]{64}")
          COMMANDS = []
          DEADLINE = time.monotonic() + 100

          class Refusal(Exception):
              pass

          def require(ok, code):
              if not ok:
                  raise Refusal(code)

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          def read(path, cap):
              require(path.is_file() and not path.is_symlink(), "E_FILE_TYPE")
              with path.open("rb") as f:
                  data = f.read(cap + 1)
              require(len(data) <= cap, "E_FILE_CAP")
              return data

          def pairs(items):
              result = {}
              for key, value in items:
                  require(key not in result, "E_JSON_DUPLICATE")
                  result[key] = value
              return result

          def load(path, cap=65536):
              return json.loads(read(path, cap).decode("utf-8"), object_pairs_hook=pairs)

          def put(path, value):
              data = (json.dumps(value, sort_keys=True, indent=2) + "\n").encode()
              require(len(data) <= 65536, "E_RECEIPT_CAP")
              with path.open("xb") as f:
                  f.write(data)

          def binding():
              require(os.name == "nt" and platform.machine() == "AMD64", "E_PLATFORM")
              for key in ["GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"]:
                  require(re.fullmatch(r"[1-9][0-9]{0,19}", os.environ[key]), "E_RUN_BINDING")
              require(os.environ["GITHUB_EVENT_NAME"] == "pull_request", "E_EVENT")
              require(os.environ["PROOF_NUMBER"] == "11364", "E_PR")
              require(os.environ["PROOF_REPO"] == "zeroclaw-labs/zeroclaw", "E_REPO")
              require(os.environ["PROOF_TOPIC"] == "test/hardware-windows-fake-arduino-cli", "E_TOPIC")
              require(not any(os.environ.get(key) for key in ["NEXTEST_PROFILE", "NEXTEST_TEST_THREADS", "CARGO_BUILD_JOBS"]), "E_PROFILE_OR_CONCURRENCY_OVERRIDE")
              out = {key: os.environ["PROOF_" + key.upper()]
                     for key in ["head", "base", "merge", "workflow"]}
              require(all(SHA.fullmatch(x) for x in out.values()), "E_SHA")
              return {**out, "repository": "zeroclaw-labs/zeroclaw", "pr": 11364,
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "attempt": os.environ["GITHUB_RUN_ATTEMPT"]}

          def root():
              b = binding()
              return Path(os.environ["RUNNER_TEMP"]) / ("pr11364-eight-" + b["run_id"] + "-" + b["attempt"])

          # Windows 10+ JOB_LIST assigns membership atomically in CreateProcess.
          # Only lifetime/handle ownership is controlled: no CPU, memory, priority,
          # affinity, feature, concurrency or production timeout override.
          def execute(argv, seconds, caps):
              k = c.WinDLL("kernel32", use_last_error=True)
              H, D, P, Z = w.HANDLE, w.DWORD, c.c_void_p, c.c_size_t
              class SA(c.Structure):
                  _fields_ = [("size", D), ("descriptor", P), ("inherit", w.BOOL)]
              class SI(c.Structure):
                  _fields_ = [("cb", D), ("reserved", w.LPWSTR), ("desktop", w.LPWSTR),
                      ("title", w.LPWSTR), *[(x, D) for x in ["x", "y", "sx", "sy", "cx", "cy", "fill", "flags"]],
                      ("show", w.WORD), ("reserved2_size", w.WORD), ("reserved2", P),
                      ("stdin", H), ("stdout", H), ("stderr", H)]
              class SX(c.Structure):
                  _fields_ = [("si", SI), ("attrs", P)]
              class PI(c.Structure):
                  _fields_ = [("process", H), ("thread", H), ("pid", D), ("tid", D)]
              class Limits(c.Structure):
                  _fields_ = [("process_time", c.c_longlong), ("job_time", c.c_longlong),
                      ("flags", D), ("min_ws", Z), ("max_ws", Z), ("active_limit", D),
                      ("affinity", Z), ("priority", D), ("scheduling", D)]
              class Extended(c.Structure):
                  _fields_ = [("basic", Limits), ("io", c.c_ulonglong * 6),
                      ("process_memory", Z), ("job_memory", Z), ("peak_process", Z), ("peak_job", Z)]
              class Accounting(c.Structure):
                  _fields_ = [("times", c.c_longlong * 4), ("faults", D),
                      ("total", D), ("active", D), ("terminated", D)]
              signatures = {
                  "CreateJobObjectW": ([P, w.LPCWSTR], H),
                  "SetInformationJobObject": ([H, c.c_int, P, D], w.BOOL),
                  "QueryInformationJobObject": ([H, c.c_int, P, D, P], w.BOOL),
                  "TerminateJobObject": ([H, w.UINT], w.BOOL),
                  "CreatePipe": ([P, P, P, D], w.BOOL),
                  "PeekNamedPipe": ([H, P, D, P, P, P], w.BOOL),
                  "ReadFile": ([H, P, D, P, P], w.BOOL),
                  "SetHandleInformation": ([H, D, D], w.BOOL),
                  "CreateFileW": ([w.LPCWSTR, D, D, P, D, D, H], H),
                  "InitializeProcThreadAttributeList": ([P, D, D, P], w.BOOL),
                  "UpdateProcThreadAttribute": ([P, D, Z, P, Z, P, P], w.BOOL),
                  "DeleteProcThreadAttributeList": ([P], None),
                  "CreateProcessW": ([w.LPCWSTR, w.LPWSTR, P, P, w.BOOL, D, P, w.LPCWSTR, P, P], w.BOOL),
                  "WaitForSingleObject": ([H, D], D),
                  "GetExitCodeProcess": ([H, P], w.BOOL),
                  "CloseHandle": ([H], w.BOOL),
              }
              for name, (args, result) in signatures.items():
                  fn = getattr(k, name); fn.argtypes = args; fn.restype = result
              owned, pipes, buffers, faults = [], [], [bytearray(), bytearray()], []
              job, attrs, pi = None, None, PI()
              eof = [False, False]
              scratch = c.create_string_buffer(4096)
              combined = 4096 if caps == (4096, 4096) else (2097152 if argv == RUN else sum(caps))
              start = time.monotonic()
              deadline = min(start + seconds, DEADLINE)
              cleanup_ok, rc_value, accepted_data = False, None, None
              def check(ok):
                  require(bool(ok), "E_WINDOWS_API")
              def refuse(code):
                  if not faults:
                      faults.append(code)
                  raise Refusal(code)
              def active():
                  a = Accounting()
                  check(k.QueryInformationJobObject(job, 1, c.byref(a), c.sizeof(a), None))
                  return a.active
              def drain(handle, index):
                  # This caller is the sole reader and retains every native
                  # handle. No thread, CRT FD or file-object transfer exists.
                  if eof[index]:
                      return
                  require(time.monotonic() < deadline, "E_COMMAND_TIMEOUT")
                  available = D()
                  peeked = k.PeekNamedPipe(handle, None, 0, None, c.byref(available), None)
                  broken = not peeked and c.get_last_error() == 109
                  if not peeked and not broken:
                      refuse("E_PIPE_READ")
                  if peeked and not available.value:
                      return
                  # A closed-writer indication is not accepted as a retained-
                  # prefix completeness claim. Read out any remaining data and
                  # require ReadFile's broken-pipe/zero-count EOF confirmation.
                  request = min(4096, available.value) if peeked else 4096
                  count = D()
                  read_ok = k.ReadFile(handle, scratch, request, c.byref(count), None)
                  if not read_ok:
                      if broken and c.get_last_error() == 109 and count.value == 0:
                          eof[index] = True
                          return
                      refuse("E_PIPE_READ")
                  if not 0 < count.value <= request:
                      refuse("E_PIPE_READ")
                  if len(buffers[index]) + count.value > caps[index] or sum(map(len, buffers)) + count.value > combined:
                      refuse("E_OUTPUT_CAP")
                  buffers[index].extend(scratch.raw[:count.value])
              def complete_capture():
                  # Only this caller can mutate buffers/faults/EOF. This final
                  # synchronized boundary follows both closed-pipe drains.
                  require(not faults, faults[0] if faults else "E_PIPE_READ")
                  require(all(eof), "E_DRAIN_INCOMPLETE")
                  require(all(len(data) <= cap for data, cap in zip(buffers, caps))
                          and sum(map(len, buffers)) <= combined, "E_OUTPUT_CAP")
                  return [bytes(data) for data in buffers]
              try:
                  job = k.CreateJobObjectW(None, None); check(job)
                  limits = Extended(); limits.basic.flags = 0x2000  # KILL_ON_JOB_CLOSE
                  check(k.SetInformationJobObject(job, 9, c.byref(limits), c.sizeof(limits)))
                  sa = SA(c.sizeof(SA), None, True)
                  writes = []
                  for index in range(2):
                      rh, wh = H(), H()
                      check(k.CreatePipe(c.byref(rh), c.byref(wh), c.byref(sa), 0))
                      owned.extend([rh.value, wh.value]); writes.append(wh.value)
                      check(k.SetHandleInformation(rh, 1, 0))
                      pipes.append((rh.value, index))
                  null = k.CreateFileW("NUL", 0x80000000, 3, c.byref(sa), 3, 0x80, None)
                  require(null not in [None, H(-1).value], "E_STDIN_HANDLE"); owned.append(null)
                  size = Z()
                  require(not k.InitializeProcThreadAttributeList(None, 2, 0, c.byref(size)) and c.get_last_error() == 122, "E_ATTRIBUTE_SIZE")
                  require(0 < size.value <= 1048576, "E_ATTRIBUTE_SIZE")
                  storage = c.create_string_buffer(size.value)
                  check(k.InitializeProcThreadAttributeList(storage, 2, 0, c.byref(size)))
                  attrs = storage
                  handles = (H * 3)(null, *writes)
                  jobs = (H * 1)(job)
                  check(k.UpdateProcThreadAttribute(attrs, 0, 0x20002, handles, c.sizeof(handles), None, None))
                  check(k.UpdateProcThreadAttribute(attrs, 0, 0x2000D, jobs, c.sizeof(jobs), None, None))
                  sx = SX(); sx.si.cb = c.sizeof(SX); sx.si.flags = 0x100
                  sx.si.stdin, sx.si.stdout, sx.si.stderr = handles
                  sx.attrs = c.cast(attrs, P)
                  exe = shutil.which(argv[0]); require(exe and Path(exe).suffix.lower() == ".exe", "E_EXECUTABLE")
                  command = c.create_unicode_buffer(subprocess.list2cmdline([exe, *argv[1:]]))
                  check(k.CreateProcessW(exe, command, None, None, True, 0x80000 | 0x8000000,
                                        None, os.getcwd(), c.byref(sx), c.byref(pi)))
                  for handle in [null, *writes]:
                      check(k.CloseHandle(handle)); owned.remove(handle)
                  while True:
                      require(time.monotonic() < deadline, "E_COMMAND_TIMEOUT")
                      for handle, index in pipes:
                          drain(handle, index)
                      require(not faults, faults[0] if faults else "E_PIPE_READ")
                      state = k.WaitForSingleObject(pi.process, 0)
                      require(state in [0, 258], "E_PROCESS_WAIT")
                      if state == 0 and active() == 0 and all(eof):
                          accepted_data = complete_capture()
                          break
                      time.sleep(0.02)
                  rc = D(); check(k.GetExitCodeProcess(pi.process, c.byref(rc))); rc_value = rc.value
                  require(accepted_data == complete_capture(), "E_CAPTURE_CHANGED")
                  cleanup_ok = True
              finally:
                  # Never signal a numeric PID or taskkill an inferred tree.
                  cleanup_fault = False
                  try:
                      if job and not cleanup_ok:
                          check(k.TerminateJobObject(job, 1))
                          until = time.monotonic() + 5
                          while active() and time.monotonic() < until:
                              time.sleep(0.02)
                          require(active() == 0, "E_CLEANUP_INCOMPLETE")
                  except BaseException:
                      cleanup_fault = True
                  finally:
                      # No asynchronous reader can outlive this scope. Every
                      # read handle stays in owned through setup/read/cancel/
                      # fault paths; close failures cannot skip other handles.
                      for handle in [job, pi.thread, pi.process, *owned]:
                          if handle:
                              try:
                                  if not k.CloseHandle(handle):
                                      cleanup_fault = True
                              except BaseException:
                                  cleanup_fault = True
                      if attrs is not None:
                          try:
                              k.DeleteProcThreadAttributeList(attrs)
                          except BaseException:
                              cleanup_fault = True
                      data = [bytes(x) for x in buffers]
                      COMMANDS.append({"argv": argv, "exit": rc_value, "elapsed_seconds": round(time.monotonic() - start, 3),
                          "stdout_bytes": len(data[0]), "stderr_bytes": len(data[1]),
                          "stdout_sha256": digest(data[0]), "stderr_sha256": digest(data[1]),
                          "owned_job_empty": cleanup_ok and not cleanup_fault})
                      # Bounded raw failures stay private, including nonzero exits.
                      # Never echo Cargo/test output or exception text into Actions.
                      if argv in [LIST, RUN]:
                          label = "list" if argv == LIST else "test"
                          for index, channel in enumerate(["stdout", "stderr"]):
                              with (root() / "private" / (label + "-" + channel + ".raw")).open("xb") as f:
                                  f.write(data[index])
                      require(not cleanup_fault, "E_CLEANUP_INCOMPLETE")
              require(cleanup_ok and accepted_data == complete_capture(), "E_CAPTURE_INCOMPLETE")
              require(rc_value == 0, "E_COMMAND_EXIT")
              return accepted_data

          def meta(argv):
              return execute(argv, 5, (4096, 4096))[0].decode("utf-8").strip()

          def git(*args):
              return meta(["git", "-c", "core.fsmonitor=false", "-c", "core.hooksPath=NUL",
                           "-c", "core.attributesFile=NUL", *args])

          def source():
              b = binding()
              parents = git("rev-list", "--parents", "-n", "1", "HEAD").split()
              require(parents == [b["head"], ANCESTOR], "E_PARENT")
              require(git("diff-tree", "--no-commit-id", "--name-status", "-r", ANCESTOR, "HEAD") == "A\t" + WORKFLOW, "E_SOURCE_SCOPE")
              require(not git("status", "--porcelain=v1", "--untracked-files=all"), "E_WORKTREE")
              require(git("rev-parse", "HEAD:" + ARDUINO) == "028627cb1907b9aace3cec9f6bb9a9e7200702cb", "E_ARDUINO_BLOB")
              paths = [ARDUINO, "Cargo.lock", "Cargo.toml", "crates/zeroclaw-hardware/Cargo.toml", WORKFLOW]
              hashes = {path: digest(read(Path(path), 1048576)) for path in paths}
              require(hashes[ARDUINO] == "56d246bdd3103249d6b8b7eba9294e40ebd025e3d716d3b8eb8424d9435323dc", "E_ARDUINO_BYTES")
              require(hashes["Cargo.lock"] == "4294db86b3307b07bfb67f1c10b3bd686069c6b2b2dbfae39af54c58846410ad", "E_LOCK")
              require(hashes["Cargo.toml"] == "4c955ec6672a3a255f4962a21c821e468e89424cd9b4937660f0f40a898745ba", "E_MANIFEST")
              require(hashes["crates/zeroclaw-hardware/Cargo.toml"] == "7f8d1fd77e33cff1deb4b2fc81d8e8eec485bf0d78b1a36ef7dfba09b5fcf466", "E_MANIFEST")
              tree = git("rev-parse", "HEAD^{tree}"); require(SHA.fullmatch(tree), "E_TREE")
              return {"binding": b, "tree": tree, "parents": parents[1:],
                      "file_sha256": hashes, "arduino_blob": "028627cb1907b9aace3cec9f6bb9a9e7200702cb",
                      "body_hash_basis": "Pinned inventory bound by complete unchanged Arduino bytes, not a new Rust AST extraction",
                      "body_sha256": dict(zip(EXPECTED, BODY_HASHES)),
                      "merge_base_workflow_fields": "Official event descriptors, distinct from the explicitly checked-out head"}

          def executable(path):
              p = Path(path).resolve()
              require(p.is_relative_to((Path.cwd() / "target").resolve()) and p.suffix.lower() == ".exe", "E_BINARY_PATH")
              relative = p.relative_to(Path.cwd()).as_posix()
              require(re.fullmatch(r"target/(?:x86_64-pc-windows-msvc/)?debug/deps/zeroclaw_hardware-[0-9a-f]{16}\.exe", relative), "E_BINARY_PATH")
              return {"sha256": digest(read(p, 268435456)), "bytes": p.stat().st_size,
                      "relative_path": relative}

          def selection():
              j = load(root() / "private/list.json", 2097152)
              require(set(j) == {"rust-build-meta", "test-count", "rust-suites"}, "E_LIST_SCHEMA")
              require(type(j["test-count"]) is int and j["test-count"] >= 8, "E_LIST_COUNT")
              require(type(j["rust-suites"]) is dict and set(j["rust-suites"]) == {"zeroclaw-hardware"}, "E_SUITE")
              s = j["rust-suites"]["zeroclaw-hardware"]
              require(set(s) == {"package-name", "binary-id", "binary-name", "package-id", "kind", "binary-path", "build-platform", "cwd", "status", "testcases"}, "E_SUITE_SCHEMA")
              require(s["package-name"] == s["binary-id"] == "zeroclaw-hardware" and s["binary-name"] == "zeroclaw_hardware" and s["kind"] == "lib" and s["status"] == "listed" and s["build-platform"] == "target", "E_SUITE")
              require(Path(s["cwd"]).resolve() == (Path.cwd() / "crates/zeroclaw-hardware").resolve(), "E_SUITE_CWD")
              require(type(s["testcases"]) is dict and len(s["testcases"]) == j["test-count"], "E_LIST_COUNT")
              matched, excluded = [], {"expression": 0, "ignored": 0}
              for name, case in s["testcases"].items():
                  require(re.fullmatch(r"[A-Za-z0-9_:]+", name), "E_TEST_NAME")
                  require(set(case) == {"kind", "ignored", "filter-match"} and case["kind"] == "test" and type(case["ignored"]) is bool, "E_CASE_SCHEMA")
                  f = case["filter-match"]
                  if f == {"status": "matches"}:
                      require(case["ignored"] is False, "E_SELECTED_IGNORED"); matched.append(name)
                  else:
                      require(not name.startswith(MODULE), "E_SELECTED_SKIPPED")
                      require(f == {"status": "mismatch", "reason": "expression"} or (case["ignored"] is True and f == {"status": "mismatch", "reason": "ignored"}), "E_FILTER_SCHEMA")
                      excluded[f["reason"]] += 1
              require(len(matched) == 8 and set(matched) == set(EXPECTED), "E_SELECTION")
              # Known root metadata keys are checked, but values unrelated to
              # selection remain opaque/private: build-script-info includes envs.
              bm = j["rust-build-meta"]
              require(type(bm) is dict and set(bm) <= {"target-directory", "build-directory", "base-output-directories", "non-test-binaries", "build-script-out-dirs", "build-script-info", "linked-paths", "platforms", "target-platforms", "target-platform"}, "E_BUILD_META_SCHEMA")
              require({"target-directory", "base-output-directories", "non-test-binaries", "linked-paths"} <= set(bm), "E_BUILD_META_SCHEMA")
              return {"binding": binding(), "selected": sorted(matched), "selected_ignored": 0,
                      "excluded_before_run": j["test-count"] - 8, "excluded_reasons": excluded,
                      "list_sha256": digest(read(root() / "private/list.json", 2097152)),
                      "executable": executable(s["binary-path"])}

          def outcomes(sel):
              raw = read(root() / "private/test.log", 2097152)
              text = raw.decode("utf-8")
              require(text.endswith("\n") and "\x1b" not in text and "\r" not in text, "E_LOG_ENCODING")
              lines = [x.strip() for x in text.splitlines() if x.strip()]
              seen, indices, starts, summaries, ids, bars, finished = [], [], 0, 0, [], 0, 0
              excluded = sel["excluded_before_run"]
              suffix = "" if not excluded else " (" + str(excluded) + (" test" if excluded == 1 else " tests") + " skipped)"
              for line in lines:
                  m = re.fullmatch(r"PASS \[ *[0-9]+\.[0-9]{3}s\] \( *([1-8])/8\) zeroclaw-hardware (peripherals::arduino_upload::tests::[a-z_]+)", line)
                  if m:
                      require(m[2] in EXPECTED, "E_EXTRA_RESULT"); seen.append(m[2]); indices.append(int(m[1])); continue
                  m = re.fullmatch(r"Nextest run ID ([0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}) with nextest profile: default", line)
                  if m:
                      ids.append(m[1]); continue
                  if line == "Starting 8 tests across 1 binary" + suffix:
                      starts += 1; continue
                  if re.fullmatch(r"Summary \[ *[0-9]+\.[0-9]{3}s\] 8 tests run: 8 passed, " + str(excluded) + " skipped", line):
                      summaries += 1; continue
                  if line in ["────────────", "------------"]:
                      bars += 1; continue
                  if re.fullmatch(r"Finished `test` profile \[unoptimized \+ debuginfo\] target\(s\) in [0-9]+\.[0-9]{2}s", line):
                      finished += 1; continue
                  raise Refusal("E_UNKNOWN_RESULT_OR_PRIVACY")
              require(len(seen) == 8 and set(seen) == set(EXPECTED) and sorted(indices) == list(range(1, 9)), "E_NAMED_PASS")
              require(starts == summaries == len(ids) == 1 and bars == 2 and finished <= 1, "E_SUMMARY")
              return {"binding": binding(), "named_pass": seen, "nextest_run_id": ids[0],
                      "summary": {"run": 8, "passed": 8, "selected_skipped": 0, "excluded_before_run": excluded},
                      "test_log_sha256": digest(raw)}

          def platform_receipt():
              value = load(root() / "private/platform.json")
              require(set(value) == {"binding", "runner_label", "image", "compiler", "cargo", "nextest", "nextest_executable_sha256", "cache"} and value["binding"] == binding(), "E_PLATFORM_SCHEMA")
              require(value["runner_label"] == "windows-latest", "E_PLATFORM_SCHEMA")
              require(set(value["image"]) == {"ImageOS", "ImageVersion", "RUNNER_OS", "RUNNER_ARCH"}, "E_PLATFORM_SCHEMA")
              require(all(re.fullmatch(r"[A-Za-z0-9_.-]{1,100}", x) for x in value["image"].values()), "E_PLATFORM_SCHEMA")
              require(value["image"]["RUNNER_OS"] == "Windows" and value["image"]["RUNNER_ARCH"] == "X64", "E_PLATFORM_SCHEMA")
              require(re.fullmatch(r"rustc 1\.98\.0 \([0-9a-f]{7,40} [0-9]{4}-[0-9]{2}-[0-9]{2}\)\nbinary: rustc\ncommit-hash: [0-9a-f]{40}\ncommit-date: [0-9]{4}-[0-9]{2}-[0-9]{2}\nhost: x86_64-pc-windows-msvc\nrelease: 1\.98\.0\nLLVM version: [0-9.]+", value["compiler"]), "E_COMPILER_SCHEMA")
              require(re.fullmatch(r"cargo 1\.98\.0 \([0-9a-f]{7,40} [0-9]{4}-[0-9]{2}-[0-9]{2}\)", value["cargo"]), "E_COMPILER_SCHEMA")
              require(re.fullmatch(r"cargo-nextest 0\.9\.143(?: \([0-9a-f]{7,40} [0-9]{4}-[0-9]{2}-[0-9]{2}\))?", value["nextest"]), "E_NEXTEST_SCHEMA")
              installed = Path(shutil.which("cargo")).parent / "cargo-nextest.exe"
              require(Path(shutil.which("cargo-nextest")).resolve() == installed.resolve(), "E_NEXTEST_RESOLUTION")
              require(installed.parent.resolve() == (Path(os.environ.get("CARGO_HOME", str(Path.home() / ".cargo"))) / "bin").resolve(), "E_NEXTEST_RESOLUTION")
              require(HEX.fullmatch(value["nextest_executable_sha256"]) and value["nextest_executable_sha256"] == digest(read(installed, 67108864)), "E_NEXTEST_DRIFT")
              cache = value["cache"]
              require(set(cache) == {"action", "shared_key", "save", "exact_match_output", "key_and_restore_source"} and cache["action"] == "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6" and cache["shared_key"] == "platform-test" and cache["save"] is False and cache["exact_match_output"] in ["true", "false"] and cache["key_and_restore_source"] == "Independent official Restore-only Rust cache step log readback required; false alone does not distinguish fallback from miss", "E_CACHE_SCHEMA")
              return value

          def command_receipt(phase):
              value = load(root() / "private" / (phase + "-commands.json"))
              require(set(value) == {"binding", "commands"} and value["binding"] == binding() and type(value["commands"]) is list and len(value["commands"]) <= 64, "E_COMMAND_SCHEMA")
              allowed = [LIST, RUN, ["rustc", "-vV"], ["cargo", "-V"], ["cargo", "nextest", "--version"]]
              for args in [["rev-list", "--parents", "-n", "1", "HEAD"], ["diff-tree", "--no-commit-id", "--name-status", "-r", ANCESTOR, "HEAD"], ["status", "--porcelain=v1", "--untracked-files=all"], ["rev-parse", "HEAD:" + ARDUINO], ["rev-parse", "HEAD^{tree}"]]:
                  allowed.append(["git", "-c", "core.fsmonitor=false", "-c", "core.hooksPath=NUL", "-c", "core.attributesFile=NUL", *args])
              for row in value["commands"]:
                  require(set(row) == {"argv", "exit", "elapsed_seconds", "stdout_bytes", "stderr_bytes", "stdout_sha256", "stderr_sha256", "owned_job_empty"} and row["argv"] in allowed and type(row["exit"]) is int and row["exit"] == 0 and row["owned_job_empty"] is True, "E_COMMAND_SCHEMA")
                  require(type(row["elapsed_seconds"]) in [int, float] and 0 <= row["elapsed_seconds"] <= 2705 and all(type(row[x]) is int and 0 <= row[x] <= 16777216 for x in ["stdout_bytes", "stderr_bytes"]) and all(HEX.fullmatch(row[x]) for x in ["stdout_sha256", "stderr_sha256"]), "E_COMMAND_SCHEMA")
              return value

          def main(phase):
              global DEADLINE
              DEADLINE = time.monotonic() + {"prepare": 100, "setup": 100, "list": 2690, "test": 290, "verify": 100}[phase]
              os.environ.update(GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL="NUL", GIT_CONFIG_SYSTEM="NUL", GIT_ATTR_NOSYSTEM="1", GIT_TERMINAL_PROMPT="0")
              r = root()
              try:
                  if phase == "prepare":
                      r.mkdir(); (r / "private").mkdir()
                      shutil.copyfile(__file__, r / "harness.py")
                      put(r / "private/source.json", source())
                  elif phase == "setup":
                      require(source() == load(r / "private/source.json"), "E_SOURCE_DRIFT")
                      url = "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.143/cargo-nextest-0.9.143-x86_64-pc-windows-msvc.tar.gz"
                      archive = r / "private/nextest.tar.gz"
                      with urllib.request.urlopen(url, timeout=5) as response, archive.open("xb") as f:
                          total = 0
                          while True:
                              require(time.monotonic() < DEADLINE, "E_DOWNLOAD_TIMEOUT")
                              block = response.read(65536)
                              if not block:
                                  break
                              total += len(block); require(total <= 67108864, "E_ARCHIVE_CAP"); f.write(block)
                      require(digest(read(archive, 67108864)) == "c42a1dbde532da06dc9b4a43d44fd0ce668b836c2ab7388410f10ff9834476a2", "E_NEXTEST_CHECKSUM")
                      with tarfile.open(archive, "r:gz") as tar:
                          entries = tar.getmembers(); require(len(entries) <= 128, "E_ARCHIVE_SCHEMA")
                          chosen = [x for x in entries if Path(x.name).name == "cargo-nextest.exe"]
                          require(len(chosen) == 1 and chosen[0].isfile() and 0 < chosen[0].size <= 67108864, "E_ARCHIVE_SCHEMA")
                          with tar.extractfile(chosen[0]) as f:
                              tool = f.read(67108865)
                          require(len(tool) == chosen[0].size, "E_ARCHIVE_CAP")
                      toolpath = Path(shutil.which("cargo")).parent / "cargo-nextest.exe"
                      toolpath.write_bytes(tool)
                      require(read(toolpath, 67108864) == tool, "E_INSTALL")
                      require(Path(shutil.which("cargo-nextest")).resolve() == toolpath.resolve(), "E_NEXTEST_RESOLUTION")
                      require(toolpath.parent.resolve() == (Path(os.environ.get("CARGO_HOME", str(Path.home() / ".cargo"))) / "bin").resolve(), "E_NEXTEST_RESOLUTION")
                      compiler = meta(["rustc", "-vV"])
                      cargo = meta(["cargo", "-V"])
                      version = meta(["cargo", "nextest", "--version"])
                      require(compiler.startswith("rustc 1.98.0 ") and "\nhost: x86_64-pc-windows-msvc\n" in compiler and "\nrelease: 1.98.0\n" in compiler, "E_COMPILER")
                      require(re.fullmatch(r"cargo 1\.98\.0 \([0-9a-f]+ [0-9-]+\)", cargo), "E_COMPILER")
                      require(re.fullmatch(r"cargo-nextest 0\.9\.143(?: .*)?", version), "E_NEXTEST_VERSION")
                      image = {x: os.environ.get(x, "") for x in ["ImageOS", "ImageVersion", "RUNNER_OS", "RUNNER_ARCH"]}
                      require(all(re.fullmatch(r"[A-Za-z0-9_.-]{1,100}", v) for v in image.values()), "E_RUNNER_METADATA")
                      cache = os.environ["CACHE_HIT"]
                      require(cache in ["true", "false"], "E_CACHE_OUTPUT")
                      put(r / "private/platform.json", {"binding": binding(), "runner_label": "windows-latest", "image": image,
                          "compiler": compiler, "cargo": cargo, "nextest": version, "nextest_executable_sha256": digest(tool),
                          "cache": {"action": "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6", "shared_key": "platform-test", "save": False,
                              "exact_match_output": cache, "key_and_restore_source": "Independent official Restore-only Rust cache step log readback required; false alone does not distinguish fallback from miss"}})
                  elif phase == "list":
                      require(source() == load(r / "private/source.json"), "E_SOURCE_DRIFT")
                      platform_receipt()
                      out, err = execute(LIST, 2700, (2097152, 16777216))
                      (r / "private/list.json").write_bytes(out)
                      (r / "private/build.log").write_bytes(err)
                      put(r / "private/selection.json", selection())
                  elif phase == "test":
                      require(source() == load(r / "private/source.json"), "E_SOURCE_DRIFT")
                      platform_receipt()
                      require(selection() == load(r / "private/selection.json"), "E_SELECTION_DRIFT")
                      # Two pipes are merged only after bounded capture. Nextest's
                      # human reporter is stderr; stdout must be empty on success.
                      out, err = execute(RUN, 300, (2097152, 2097152))
                      require(not out and len(err) <= 2097152, "E_TEST_STDOUT")
                      (r / "private/test.log").write_bytes(err.replace(b"\r\n", b"\n"))
                      require(selection() == load(r / "private/selection.json"), "E_BINARY_DRIFT")
                      put(r / "private/outcome.json", outcomes(selection()))
                  elif phase == "verify":
                      require(all(os.environ[x] == "success" for x in ["PREPARE_OUTCOME", "TOOLCHAIN_OUTCOME", "CACHE_OUTCOME", "SETUP_OUTCOME", "LIST_OUTCOME", "TEST_OUTCOME"]), "E_PREVIOUS_STEP")
                      require(source() == load(r / "private/source.json"), "E_SOURCE_DRIFT")
                      platform_receipt()
                      sel = selection(); require(sel == load(r / "private/selection.json"), "E_BINARY_DRIFT")
                      require(outcomes(sel) == load(r / "private/outcome.json"), "E_OUTCOME_DRIFT")
                      export = r / "success"; export.mkdir()
                      names = ["source.json", "platform.json", "selection.json", "outcome.json", "commands.json", "test.log"]
                      for name in names[:4]:
                          value = load(r / "private" / name)
                          require(value["binding"] == binding(), "E_EXPORT_BINDING")
                          put(export / name, value)
                      put(export / "commands.json", {"binding": binding(), "phases": [command_receipt(x) for x in ["prepare", "setup", "list", "test"]]})
                      (export / "test.log").write_bytes(read(r / "private/test.log", 2097152))
                      require(set(x.name for x in export.iterdir()) == set(names), "E_EXPORT_WHITELIST")
                      inventory = {x: {"bytes": (export / x).stat().st_size, "sha256": digest(read(export / x, 2097152 if x == "test.log" else 65536))} for x in names}
                      require(sum(x["bytes"] for x in inventory.values()) <= 20971520, "E_EXPORT_CAP")
                      put(export / "decision.json", {"binding": binding(), "safe_export": True, "inventory": inventory})
                      require(set(x.name for x in export.iterdir()) == set(names + ["decision.json"]), "E_EXPORT_WHITELIST")
                      require(sum(x.stat().st_size for x in export.iterdir()) <= 20971520, "E_EXPORT_CAP")
                      # Decision is written only after complete source/selection/
                      # named-result/privacy validation; failed finalizer emits none.
                      with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                          f.write("success_export=true\n")
              except BaseException as error:
                  code = str(error) if isinstance(error, Refusal) else "E_UNEXPECTED"
                  require(re.fullmatch(r"E_[A-Z_]+", code), "E_CODE")
                  if (r / "private").is_dir():
                      put(r / "private" / (phase + "-failure.json"), {"binding": binding(), "code": code})
                  print("::error::PR11364 evidence refused: " + code)
                  raise SystemExit(1)
              finally:
                  if (r / "private").is_dir():
                      put(r / "private" / (phase + "-commands.json"), {"binding": binding(), "commands": COMMANDS})

          if __name__ == "__main__":
              main(sys.argv[1] if len(sys.argv) == 2 else "prepare")

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        id: toolchain
        timeout-minutes: 3
        with:
          toolchain: 1.98.0

      - name: Restore-only Rust cache
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        timeout-minutes: 3
        with:
          shared-key: platform-test
          cache-on-failure: true
          save-if: false

      - name: Install pinned nextest and record actual platform
        id: setup
        timeout-minutes: 2
        shell: python {0}
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          import os, runpy
          from pathlib import Path
          import sys
          p = Path(os.environ["RUNNER_TEMP"]) / ("pr11364-eight-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]) / "harness.py"
          sys.argv = [str(p), "setup"]
          runpy.run_path(str(p), run_name="__main__")

      - name: Build and list exact hardware library selection
        id: list
        timeout-minutes: 45
        shell: python {0}
        run: |
          import os, runpy
          from pathlib import Path
          import sys
          p = Path(os.environ["RUNNER_TEMP"]) / ("pr11364-eight-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]) / "harness.py"
          sys.argv = [str(p), "list"]
          runpy.run_path(str(p), run_name="__main__")

      - name: Run exact eight and require each actual PASS
        id: test
        timeout-minutes: 5
        shell: python {0}
        run: |
          import os, runpy
          from pathlib import Path
          import sys
          p = Path(os.environ["RUNNER_TEMP"]) / ("pr11364-eight-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]) / "harness.py"
          sys.argv = [str(p), "test"]
          runpy.run_path(str(p), run_name="__main__")

      - name: Validate current evidence or emit minimum safe failure
        id: verify
        if: ${{ always() && !cancelled() }}
        timeout-minutes: 2
        shell: python {0}
        env:
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          CACHE_OUTCOME: ${{ steps.cache.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          LIST_OUTCOME: ${{ steps.list.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          import json, os, re, runpy, sys
          from pathlib import Path
          run, attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          assert re.fullmatch(r"[1-9][0-9]{0,19}", run) and re.fullmatch(r"[1-9][0-9]{0,19}", attempt)
          r = Path(os.environ["RUNNER_TEMP"]) / ("pr11364-eight-" + run + "-" + attempt)
          try:
              sys.argv = [str(r / "harness.py"), "verify"]
              runpy.run_path(str(r / "harness.py"), run_name="__main__")
          except BaseException:
              # No refused output, exception text, keys, config, env, paths or
              # screenshots enter this independent fixed-schema failure receipt.
              head = os.environ["PROOF_HEAD"]
              assert re.fullmatch(r"[0-9a-f]{40}", head)
              safe = r / "failure"; safe.mkdir(parents=True)
              value = {"schema": 1, "repository": "zeroclaw-labs/zeroclaw", "pr": 11364,
                       "head": head, "run_id": run, "attempt": attempt,
                       "code": "E_QUALIFICATION_INCOMPLETE", "eight_pass_verified": False}
              keys = ["PREPARE_OUTCOME", "TOOLCHAIN_OUTCOME", "CACHE_OUTCOME", "SETUP_OUTCOME", "LIST_OUTCOME", "TEST_OUTCOME"]
              states = {key: os.environ[key] for key in keys}
              assert all(x in ["success", "failure", "skipped", "cancelled", ""] for x in states.values())
              value["step_outcomes"] = states
              # Refused, capped, incomplete and private raw captures are never
              # read here. Failure export has only fixed safe fields and states.
              data = (json.dumps(value, sort_keys=True) + "\n").encode()
              assert len(data) <= 4096
              with (safe / "failure.json").open("xb") as f:
                  f.write(data)
              with (r / "failure-decision.json").open("x") as f:
                  json.dump({"head": head, "run_id": run, "attempt": attempt, "safe_export": True}, f)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("failure_export=true\n")
              raise SystemExit(1)

      - name: Upload validated eight-test evidence
        if: ${{ success() && !cancelled() && steps.verify.outputs.success_export == 'true' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr11364-eight-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/success/source.json
            ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/success/platform.json
            ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/success/selection.json
            ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/success/outcome.json
            ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/success/commands.json
            ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/success/test.log
            ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/success/decision.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload minimum safe failure evidence
        if: ${{ always() && !cancelled() && steps.verify.outputs.failure_export == 'true' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr11364-eight-failure-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr11364-eight-${{ github.run_id }}-${{ github.run_attempt }}/failure/failure.json
          if-no-files-found: error
          retention-days: 1
