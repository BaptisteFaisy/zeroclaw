name: Cross-Platform Build

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Feature distribution to measure
        required: true
        type: choice
        default: dist
        options:
          - dist
          - dist-broad
      release_tools_only:
        description: Skip release builds and run only the native release-tool smoke
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release-tool-smoke:
    name: Verify release tool / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux cross
            os: ubuntu-22.04
            tool: cross
          - name: Windows Tauri CLI
            os: windows-latest
            tool: tauri-cli
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.98.0

      - name: Verify native runner and revision
        shell: bash
        run: |
          test "$RUNNER_ARCH" = "X64"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "### Release tool smoke / ${{ matrix.name }}"
            echo
            echo "- Revision: \`$GITHUB_SHA\`"
            echo "- Runner: \`$RUNNER_OS/$RUNNER_ARCH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Transient resolver capture for the shared ruzstd dependency repair.
      # Remove these two steps before the final dependency PR is qualified.
      - name: Capture probe-rs 0.32 dependency resolution
        id: probe_resolver
        if: >-
          inputs.release_tools_only && matrix.tool == 'cross' &&
          github.repository == 'zeroclaw-labs/zeroclaw' &&
          github.ref == 'refs/heads/fix/ruzstd-probe-rs-032-resolver-20261013'
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = zeroclaw-labs/zeroclaw
          test "$GITHUB_REF" = refs/heads/fix/ruzstd-probe-rs-032-resolver-20261013
          test "$RUNNER_OS/$RUNNER_ARCH" = Linux/X64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          resolver_base=30fabebc7056dd38a946aaa7c47696d10253416d
          resolver_parents="$(git cat-file -p HEAD | sed '/^$/q' | sed -n 's/^parent //p')"
          test "$resolver_parents" = "$resolver_base"
          timeout --signal=TERM --kill-after=5s 30s git fetch --no-tags --depth=1 origin "$resolver_base"
          resolver_paths="$(git diff --name-only "$resolver_base" HEAD)"
          test "$resolver_paths" = $'.github/workflows/cross-platform-build-manual.yml\ncrates/zeroclaw-hardware/Cargo.toml\ncrates/zeroclaw-tools/Cargo.toml'
          resolver_old_lock=0726318722c397574d91ecdf58251f736b2caaf34a9702331a0df8a7670c3608
          printf '%s\n' \
            "$resolver_old_lock  Cargo.lock" \
            '145d5d51d81350f66de8838e330a4881154b0244ad71d9d6ad31e61ddddda93c  crates/zeroclaw-tools/Cargo.toml' \
            '2a82f2923c413238c2c8da8e933b80798d8b3f8c6f02c8e720af460ca69063da  crates/zeroclaw-hardware/Cargo.toml' | sha256sum --check --strict
          test "$(sed -n '/^name = "probe-rs"$/,+1p' Cargo.lock)" = $'name = "probe-rs"\nversion = "0.31.0"'

          resolver_capture="$RUNNER_TEMP/probe-rs-032-resolver-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$resolver_capture"
          mkdir -m 700 "$resolver_capture"
          echo "capture_dir=$resolver_capture" >> "$GITHUB_OUTPUT"
          cp Cargo.lock "$resolver_capture/input-Cargo.lock"
          cp crates/zeroclaw-tools/Cargo.toml "$resolver_capture/tools-Cargo.toml"
          cp crates/zeroclaw-hardware/Cargo.toml "$resolver_capture/hardware-Cargo.toml"
          {
            printf 'head=%s\ntree=%s\nparent=%s\n' "$GITHUB_SHA" "$(git rev-parse 'HEAD^{tree}')" "$resolver_base"
            printf 'workflow=%s\nrun=%s\nattempt=%s\n' "$GITHUB_WORKFLOW_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'runner=%s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH"
            sha256sum Cargo.lock crates/zeroclaw-tools/Cargo.toml crates/zeroclaw-hardware/Cargo.toml
          } > "$resolver_capture/provenance.txt"
          printf 'phase\texit_status\n' > "$resolver_capture/status.tsv"

          resolver_finish() {
            resolver_status=$?
            resolver_require_complete=false
            if [[ "$resolver_status" == 0 ]]; then resolver_require_complete=true; fi
            trap - EXIT HUP INT TERM
            set +e
            cp Cargo.lock "$resolver_capture/final-observed-Cargo.lock" || resolver_status=1
            cp "$resolver_capture/input-Cargo.lock" Cargo.lock
            resolver_restore_status=$?
            resolver_restored_hash="$(sha256sum Cargo.lock | cut -d ' ' -f 1)"
            resolver_hash_status=$?
            resolver_final_status="$(git status --porcelain=v1 --untracked-files=all)"
            resolver_git_status=$?
            if [[ "$resolver_restore_status" != 0 || "$resolver_hash_status" != 0 || "$resolver_git_status" != 0 || "$resolver_restored_hash" != "$resolver_old_lock" || -n "$resolver_final_status" ]]; then
              resolver_status=1
            fi
            printf 'step_exit=%s\nrestore_exit=%s\nrestored_lock_sha256=%s\ncheckout_clean=%s\n' \
              "$resolver_status" "$resolver_restore_status" "$resolver_restored_hash" "$([[ -z "$resolver_final_status" ]] && echo true || echo false)" > "$resolver_capture/completion.txt" || resolver_status=1
            (
              cd "$resolver_capture" || exit 1
              for resolver_file in input-Cargo.lock tools-Cargo.toml hardware-Cargo.toml provenance.txt status.tsv completion.txt final-observed-Cargo.lock output-Cargo.lock resolver-metadata.json toolchain.stdout toolchain.stderr toolchain.command cargo-version.stdout cargo-version.stderr cargo-version.command update.stdout update.stderr update.command metadata.stdout metadata.stderr metadata.command verify.stdout verify.stderr verify.command fetch.stdout fetch.stderr fetch.command; do
                if [[ -f "$resolver_file" ]]; then
                  sha256sum "$resolver_file" || exit 1
                elif [[ "$resolver_require_complete" == true ]]; then
                  exit 1
                fi
              done
            ) > "$resolver_capture/SHA256SUMS" || resolver_status=1
            exit "$resolver_status"
          }
          trap resolver_finish EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          resolver_run() {
            local resolver_phase="$1" resolver_seconds="$2" resolver_command_status
            shift 2
            printf '%q ' timeout --signal=TERM --kill-after=5s "${resolver_seconds}s" "$@" > "$resolver_capture/$resolver_phase.command"
            printf '\n' >> "$resolver_capture/$resolver_phase.command"
            set +e
            timeout --signal=TERM --kill-after=5s "${resolver_seconds}s" "$@" > "$resolver_capture/$resolver_phase.stdout" 2> "$resolver_capture/$resolver_phase.stderr"
            resolver_command_status=$?
            set -e
            printf '%s\t%s\n' "$resolver_phase" "$resolver_command_status" >> "$resolver_capture/status.tsv"
            printf 'resolver phase %s exit %s\n' "$resolver_phase" "$resolver_command_status"
            return "$resolver_command_status"
          }
          resolver_lock_unchanged() {
            test "$(sha256sum Cargo.lock | cut -d ' ' -f 1)" = "$resolver_output_hash"
            test "$(git status --porcelain=v1 --untracked-files=all)" = ' M Cargo.lock'
          }

          resolver_run toolchain 10 rustc --version
          resolver_run cargo-version 10 cargo --version
          resolver_run update 180 cargo update -p probe-rs@0.31.0 --precise 0.32.0
          cp Cargo.lock "$resolver_capture/output-Cargo.lock"
          resolver_output_hash="$(sha256sum Cargo.lock | cut -d ' ' -f 1)"
          resolver_lock_unchanged
          resolver_run metadata 120 cargo metadata --locked --format-version 1 --all-features
          cp "$resolver_capture/metadata.stdout" "$resolver_capture/resolver-metadata.json"
          resolver_lock_unchanged
          resolver_run verify 30 cargo verify-project
          resolver_lock_unchanged
          resolver_run fetch 90 cargo fetch --locked
          resolver_lock_unchanged

      - name: Upload owned dependency resolver evidence
        if: always() && steps.probe_resolver.outputs.capture_dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-rs-032-resolver-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.probe_resolver.outputs.capture_dir }}/input-Cargo.lock
            ${{ steps.probe_resolver.outputs.capture_dir }}/tools-Cargo.toml
            ${{ steps.probe_resolver.outputs.capture_dir }}/hardware-Cargo.toml
            ${{ steps.probe_resolver.outputs.capture_dir }}/provenance.txt
            ${{ steps.probe_resolver.outputs.capture_dir }}/status.tsv
            ${{ steps.probe_resolver.outputs.capture_dir }}/completion.txt
            ${{ steps.probe_resolver.outputs.capture_dir }}/final-observed-Cargo.lock
            ${{ steps.probe_resolver.outputs.capture_dir }}/output-Cargo.lock
            ${{ steps.probe_resolver.outputs.capture_dir }}/resolver-metadata.json
            ${{ steps.probe_resolver.outputs.capture_dir }}/SHA256SUMS
            ${{ steps.probe_resolver.outputs.capture_dir }}/toolchain.command
            ${{ steps.probe_resolver.outputs.capture_dir }}/toolchain.stdout
            ${{ steps.probe_resolver.outputs.capture_dir }}/toolchain.stderr
            ${{ steps.probe_resolver.outputs.capture_dir }}/cargo-version.command
            ${{ steps.probe_resolver.outputs.capture_dir }}/cargo-version.stdout
            ${{ steps.probe_resolver.outputs.capture_dir }}/cargo-version.stderr
            ${{ steps.probe_resolver.outputs.capture_dir }}/update.command
            ${{ steps.probe_resolver.outputs.capture_dir }}/update.stdout
            ${{ steps.probe_resolver.outputs.capture_dir }}/update.stderr
            ${{ steps.probe_resolver.outputs.capture_dir }}/metadata.command
            ${{ steps.probe_resolver.outputs.capture_dir }}/metadata.stdout
            ${{ steps.probe_resolver.outputs.capture_dir }}/metadata.stderr
            ${{ steps.probe_resolver.outputs.capture_dir }}/verify.command
            ${{ steps.probe_resolver.outputs.capture_dir }}/verify.stdout
            ${{ steps.probe_resolver.outputs.capture_dir }}/verify.stderr
            ${{ steps.probe_resolver.outputs.capture_dir }}/fetch.command
            ${{ steps.probe_resolver.outputs.capture_dir }}/fetch.stdout
            ${{ steps.probe_resolver.outputs.capture_dir }}/fetch.stderr
          if-no-files-found: error
          retention-days: 5

      - name: Resolve Cargo bin directory
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-${HOME}/.cargo}"
          if command -v cygpath >/dev/null 2>&1; then
            cargo_home="$(cygpath -u "$cargo_home")"
          fi
          echo "RELEASE_TOOL_CARGO_BIN=${cargo_home}/bin" >> "$GITHUB_ENV"

      - name: Install pinned release tool
        shell: bash
        run: bash scripts/ci/install_release_tool.sh "${{ matrix.tool }}"

      - name: Verify cross installation
        if: matrix.tool == 'cross'
        shell: bash
        run: |
          expected_cross_path="${RELEASE_TOOL_CARGO_BIN}/cross"
          expected_cross_util_path="${RELEASE_TOOL_CARGO_BIN}/cross-util"
          cross_path="$(command -v cross)"
          cross_util_path="$(command -v cross-util)"
          test "$cross_path" = "$expected_cross_path"
          test "$cross_util_path" = "$expected_cross_util_path"
          test -x "$expected_cross_path"
          test -x "$expected_cross_util_path"
          cross_version="$(cross --version)"
          printf '%s\n' "$cross_version"
          {
            echo "- cross: \`$cross_path\`"
            echo "- cross-util: \`$cross_util_path\`"
            echo "- cross --version: \`$cross_version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Tauri CLI installation
        if: matrix.tool == 'tauri-cli'
        shell: bash
        run: |
          expected_tauri_path="${RELEASE_TOOL_CARGO_BIN}/cargo-tauri.exe"
          tauri_path="$(command -v cargo-tauri.exe)"
          test "$tauri_path" = "$expected_tauri_path"
          test -x "$expected_tauri_path"
          direct_version="$(cargo-tauri.exe --version)"
          cargo_version="$(cargo tauri --version)"
          printf '%s\n%s\n' "$direct_version" "$cargo_version"
          {
            echo "- cargo-tauri.exe: \`$tauri_path\`"
            echo "- cargo-tauri.exe --version: \`$direct_version\`"
            echo "- cargo tauri --version: \`$cargo_version\`"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Build Web Dashboard
    if: ${{ !inputs.release_tools_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web dashboard
        # `cargo web build` is the xtask wrapper that:
        # 1. renders the gateway's OpenAPI 3.1 spec in-process,
        # 2. runs `npx openapi-typescript` to produce
        #    `web/src/lib/api-generated.ts` (gitignored — never
        #    committed since #4f60f4405),
        # 3. runs `npm ci` + `npm run build` (tsc + vite).
        # Plain `cd web && npm run build` skips step 1+2 and tsc
        # fails on the missing import.
        run: cargo web build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  build:
    name: Build ${{ inputs.distribution }} / ${{ matrix.target }}
    needs: [web]
    if: ${{ !inputs.release_tools_only }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.distribution == 'dist-broad' && 90 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # Native Linux smoke-check build intentionally uses default linker.
            # CI gate (`ci.yml`) uses clang+mold for throughput optimization.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross_compiler: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker: aarch64-linux-gnu-gcc
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            cross_compiler: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            linker_env: CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER
            linker: arm-linux-gnueabihf-gcc
          - os: ubuntu-latest
            target: arm-unknown-linux-gnueabihf
            cross_compiler: gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            linker_env: CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER
            linker: arm-linux-gnueabihf-gcc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: aarch64-linux-android
            ndk: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.os != 'Windows'
        with:
          prefix-key: ${{ matrix.os }}-${{ matrix.target }}
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist/

      - name: Install cross compiler
        if: matrix.cross_compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.cross_compiler }}

      - name: Install cross (MUSL targets)
        if: matrix.use_cross
        run: bash scripts/ci/install_release_tool.sh cross

      - name: Setup Android NDK
        if: matrix.ndk
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64) NDK_HOST="linux-x86_64" ;;
            aarch64) NDK_HOST="linux-aarch64" ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          NDK_PREBUILT="$ANDROID_NDK/toolchains/llvm/prebuilt/$NDK_HOST"
          if [ ! -d "$NDK_PREBUILT" ]; then
            echo "Android NDK prebuilt directory not found: $NDK_PREBUILT" >&2
            exit 1
          fi
          echo "$NDK_PREBUILT/bin" >> "$GITHUB_PATH"

      - name: Configure target environment
        shell: bash
        run: |
          {
            if [ "${{ matrix.use_cross || 'false' }}" = "true" ]; then
              echo "BUILD_CMD=cross build"
            else
              echo "BUILD_CMD=cargo build"
            fi
            if [ -n "${{ matrix.linker_env || '' }}" ] && [ -n "${{ matrix.linker || '' }}" ]; then
              echo "${{ matrix.linker_env }}=${{ matrix.linker }}"
            fi
            if [ "${{ matrix.target }}" = "arm-unknown-linux-gnueabihf" ]; then
              # Force ARMv6 codegen for arm-unknown-linux-gnueabihf (#4556).
              # Ubuntu's gcc-arm-linux-gnueabihf defaults to ARMv7+NEON,
              # which segfaults on ARMv6 devices (e.g., Raspberry Pi Zero W).
              echo "CFLAGS_arm_unknown_linux_gnueabihf=-march=armv6 -mfpu=vfp -mfloat-abi=hard"
              echo "CXXFLAGS_arm_unknown_linux_gnueabihf=-march=armv6 -mfpu=vfp -mfloat-abi=hard"
              echo "CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_RUSTFLAGS=-C target-feature=-neon"
            fi
          } >> "$GITHUB_ENV"

      - name: Build release
        shell: bash
        run: |
          FEATURES="$(cargo run --quiet -p xtask --bin generate -- features --selection "${{ inputs.distribution }}" --target "${{ matrix.target }}")"
          echo "Resolved features: $FEATURES"
          $BUILD_CMD --release --locked --no-default-features --features "${FEATURES}" --target ${{ matrix.target }}
          binary="target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'zeroclaw.exe' || 'zeroclaw' }}"
          bytes="$(wc -c < "$binary" | tr -d ' ')"
          if [ "$RUNNER_OS" = "macOS" ]; then
            sha256="$(shasum -a 256 "$binary" | cut -d ' ' -f 1)"
          else
            sha256="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          fi
          {
            echo "### ${{ inputs.distribution }} / ${{ matrix.target }}"
            echo
            echo "- Binary bytes: $bytes"
            echo "- Resolved features: \`$FEATURES\`"
            echo "- SHA-256: $sha256"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zeroclaw-manual-${{ inputs.distribution }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'zeroclaw.exe' || 'zeroclaw' }}
          if-no-files-found: error
          retention-days: 1
      - name: Build ZeroCode companion
        if: matrix.target != 'aarch64-linux-android'
        shell: bash
        run: $BUILD_CMD --release --locked -p zerocode --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.target != 'aarch64-linux-android'
        with:
          name: zerocode-manual-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'zerocode.exe' || 'zerocode' }}
          if-no-files-found: error
          retention-days: 1
      - name: Build ZeroRelay companion
        if: matrix.target != 'aarch64-linux-android'
        shell: bash
        run: $BUILD_CMD --release --locked -p zerorelay --target ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.target != 'aarch64-linux-android'
        with:
          name: zerorelay-manual-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'zerorelay.exe' || 'zerorelay' }}
          if-no-files-found: error
          retention-days: 1
